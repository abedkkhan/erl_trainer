[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erl-trainer"
version = "0.3.5"
description = "Experiential Reinforcement Learning (ERL) — a thin wrapper on HuggingFace TRL's GRPOTrainer implementing the ERL algorithm with reflection, memory, and internalization."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Abid Karim" },
]
keywords = [
    "reinforcement-learning",
    "language-models",
    "trl",
    "grpo",
    "reflection",
    "erl",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "trl>=0.17.0,<0.18.0",
    "transformers>=4.50.0",
    "torch>=2.0.0",
    "datasets",
    "peft",
]

[project.urls]
Repository = "https://github.com/akarim23131/erl_trainer"

[tool.hatch.build.targets.wheel]
packages = ["erl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
